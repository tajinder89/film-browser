<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/movie.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Film Browser</title>
  <style>
    /* SSR Fallback Loading Spinner */
    #app-loader {
      display: flex;
      align-items: center;
      justify-content: center;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: #ffffff;
      visibility: visible;
      z-index: 9999;
    }

    .loader-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(0, 0, 0, 0.15);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Show app once hydrated and styles are loaded */
    #app.hydrated {
      visibility: visible;
    }

    #app.hydrated #app-loader {
      display: none;
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="app-loader">
      <div class="loader-spinner"></div>
    </div>
    <!--app-html-->
  </div>
  <!--app-state-->
  <script>
    // Add hydrated class immediately to allow app visibility
    // Entry client will manage the actual content visibility
    window.markAppHydrated = function () {
      const appDiv = document.getElementById('app');
      if (appDiv) {
        appDiv.classList.add('hydrated');
      }
    };
  </script>
  <script type="module" src="/src/entry-client.tsx"></script>
</body>

</html>
